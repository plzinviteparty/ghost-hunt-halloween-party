<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111834"><title>촛불 지키기 · 핼러윈 저택</title><meta name="description" content="바람을 막고 저택의 촛불을 지켜 주세요."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111834'/%3E%3Cpath fill='%23ff4baa' d='M14 3h4v8h-4z'/%3E%3Cpath fill='%23ffcf72' d='M10 13h12v15H10z'/%3E%3C/svg%3E"><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Press+Start+2P&display=swap');:root{font-family:'Gowun Dodum',sans-serif;color:#f7eaf5;background:#10152d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#263056,#10152d 65%);min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:930px;margin:auto;padding:20px 16px 50px}header{text-align:center;padding:8px 0 14px}.eyebrow{font:10px 'Press Start 2P',monospace;color:#fa5cba;letter-spacing:2px}h1{margin:12px 0;font-size:clamp(28px,5vw,42px);color:#fff0ba;text-shadow:3px 3px #a82378}header p{margin:0;color:#c9c9df}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{border:3px solid #655b88;background:#1e2343;box-shadow:4px 4px 0 #090c20;text-align:center;padding:9px 2px}.stat small{display:block;color:#d6bbdc;font-size:13px}.stat strong{font:16px 'Press Start 2P',monospace;color:#fff0ba;line-height:2}.progress{height:14px;border:3px solid #69577f;background:#080d22;margin:0 4px 16px}.progress div{background:#fa5cba;height:100%;width:100%;transition:width .15s linear}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.room{background:#252543;border:4px solid #605376;box-shadow:inset 0 0 0 3px #363154,4px 4px 0 #090c20;min-height:165px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative}.room.danger{border-color:#f05ba9}.room.shut{opacity:.58}.room-name{font-size:14px;color:#f8dcea}.window{border:2px solid #907fa7;background:#161936;color:#f5e5ff;padding:5px 8px;min-height:32px;font-size:13px}.window.open{color:#ff8ccc;border-color:#f05ba9;background:#45204e;animation:pulse 1s infinite}.candle{display:flex;flex-direction:column;align-items:center;justify-content:end;background:none;border:0;min-width:70px;min-height:75px;color:#ffe9b9}.flame{width:20px;height:28px;background:#ffd86b;clip-path:polygon(50% 0,75% 38%,90% 65%,70% 100%,28% 100%,10% 65%,25% 40%);filter:drop-shadow(0 0 8px #ffdb8a);margin-bottom:2px}.wick{width:3px;height:5px;background:#171529}.wax{height:30px;width:26px;background:#ffe9b9;border:3px solid #eab884;box-shadow:inset 6px 0 #ffdab1}.candle.off .flame{visibility:hidden}.candle.off .wax{background:#9b91a8;box-shadow:inset 6px 0 #77718f;border-color:#605b75}.candle:disabled{cursor:default}.room-status{font-size:12px;color:#dbc9e3;height:18px}.controls{text-align:center;margin-top:17px}.primary{border:3px solid #ffafd9;background:#e946a1;color:#220c30;padding:12px 23px;font-weight:800;font-size:18px;box-shadow:4px 4px #81376d}.primary:active{transform:translate(3px,3px);box-shadow:1px 1px #81376d}.note{font-size:14px;line-height:1.6;color:#d3c6da;margin:14px auto 0;max-width:610px}.overlay{position:fixed;inset:0;background:#090d21dc;display:grid;place-items:center;padding:20px;z-index:4}.panel{max-width:430px;width:100%;border:5px solid #ef66b3;background:#232143;box-shadow:8px 8px #080a1a;padding:25px;text-align:center}.panel h2{color:#ffe7ad;font-size:27px;margin:0 0 12px}.panel p{line-height:1.7}.panel .primary{margin:12px 0 0}.hidden{display:none!important}@keyframes pulse{50%{background:#65235c}}@media(max-width:600px){main{padding:15px 10px 35px}.board{gap:6px}.room{min-height:138px;padding:5px;border-width:3px}.room-name{font-size:12px}.window{font-size:11px;padding:4px 2px;width:100%}.candle{min-height:62px}.flame{width:16px;height:22px}.wax{height:25px;width:21px}.room-status{font-size:10px}.stat strong{font-size:13px}}
.difficulty{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:5px auto 15px}.difficulty button{border:3px solid #746284;background:#252746;color:#f4e7f7;padding:8px 12px;min-width:94px}.difficulty button[aria-pressed="true"]{background:#e946a1;color:#1c1029;border-color:#ffd0e9;font-weight:bold}.difficulty button:disabled{opacity:.6;cursor:default}.mode-info{text-align:center;margin:0 0 10px;color:#ffe7ad;font-size:14px}.board.hard{grid-template-columns:repeat(5,1fr)}@media(max-width:650px){.board.hard{grid-template-columns:repeat(3,1fr)}}.window.rattle{border-color:#ddb6e8;animation:shake .13s steps(2,end) infinite}.room.rattling{border-color:#a97daa}.sound{margin-left:12px;background:#29284c;color:#ffe4f2;border:2px solid #a174a8;padding:10px 12px;min-height:46px}.sound:focus-visible,.window:focus-visible,.candle:focus-visible,.primary:focus-visible{outline:3px solid #fff0a0;outline-offset:2px}@keyframes shake{50%{transform:translateX(3px)}}</style></head><body><main><header><div class="eyebrow">HALLOWEEN MANSION</div><h1>촛불 지키기</h1><p>밤바람이 들어오기 전에 창문을 닫아 주세요.</p></header><nav class="difficulty" aria-label="난이도 선택"><button data-mode="easy" aria-pressed="false">이지</button><button data-mode="normal" aria-pressed="true">노멀</button><button data-mode="hard" aria-pressed="false">하드</button></nav><p class="mode-info" id="mode-info"></p><div class="hud"><div class="stat"><small>남은 시간</small><strong id="time">60</strong></div><div class="stat"><small>점수 / 최고점</small><strong id="score">0</strong></div><div class="stat"><small>켜진 촛불</small><strong id="lit">9/9</strong></div></div><div class="progress"><div id="bar"></div></div><section class="board" id="board" aria-label="저택의 아홉 방"></section><div class="controls"><button class="primary" id="start">게임 시작</button><button class="sound" id="sound" aria-pressed="true">소리 켜짐 ♫</button><p class="note">열린 창문을 먼저 닫고 꺼진 촛불을 눌러 켜세요. 덜컹거리는 창문을 누르면 오히려 열립니다. 촛불 유지 60%, 창문 관리 40%로 점수가 정해집니다.</p></div></main><div class="overlay hidden" id="end"><div class="panel"><h2>파티 준비 완료!</h2><p id="result"></p><button class="primary" id="again">다시 하기</button><button class="sound" id="choose">난이도 선택</button></div></div><script>
const names=['현관','서재','응접실','식당','복도','음악실','온실','다락방','비밀의 방','계단','회랑','작업실','손님방','지하실','종탑'];const modes={easy:{label:'이지',count:6,mult:1,start:2.1,end:1.1,burst:2,rattle:.22,wind:3.1},normal:{label:'노멀',count:9,mult:1.5,start:1.55,end:.53,burst:3,rattle:.32,wind:2.5},hard:{label:'하드',count:15,mult:2,start:1.2,end:.42,burst:4,rattle:.42,wind:2.3}};let mode='normal';const config=()=>modes[mode];
const board=document.getElementById('board');let rooms=[],score=0,timePoints=0,actionPoints=0,penalties=0,remaining=60,running=false,last=0,spawn=0,acc=0,draw=0,frame=0,soundOn=true,audio=null,musicTimer=null,noteIndex=0;
const rand=n=>Math.floor(Math.random()*n);function updateMode(){const d=config();document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.disabled=running});document.getElementById('mode-info').textContent=`${d.label} · 촛불 ${d.count}개 · 최고점 ${1000*d.mult}점`;board.classList.toggle('hard',mode==='hard')}function points(){return Math.floor(Math.max(0,Math.min(1000,timePoints+Math.min(400,actionPoints)-penalties))*config().mult)}function refreshScore(){score=points()}
function paint(){board.innerHTML=rooms.map((r,i)=>`<div class="room ${r.open?'danger':''} ${r.rattle>0?'rattling':''} ${!r.lit?'shut':''}"><span class="room-name">${names[i]}</span><button class="window ${r.open?'open':r.rattle>0?'rattle':''}" data-window="${i}" aria-label="${names[i]} 창문 ${r.open?'열림, 닫기':r.rattle>0?'덜컹거림, 누르면 열림':'닫힘'}">${r.open?'창문 열림 ⇢':r.rattle>0?'덜컹 덜컹':'창문 닫힘'}</button><button class="candle ${r.lit?'':'off'}" data-candle="${i}" aria-label="${names[i]} 촛불 ${r.lit?'켜짐':'켜기'}" ${r.lit?'disabled':''}><span class="flame"></span><span class="wick"></span><span class="wax"></span></button><span class="room-status">${r.open?'바람이 들어옵니다':r.rattle>0?'무슨 소리지?':r.lit?'불빛이 반짝입니다':'촛불이 꺼졌습니다'}</span></div>`).join('');document.getElementById('score').textContent=score+' / '+1000*config().mult;document.getElementById('time').textContent=Math.ceil(remaining);document.getElementById('lit').textContent=rooms.filter(r=>r.lit).length+'/'+config().count;document.getElementById('bar').style.width=remaining/60*100+'%'}
function tone(freq,duration=.14,volume=.045,type='sine',when=0){if(!soundOn||!audio)return;const at=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(Math.min(.15,volume*1.5),at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g).connect(audio.destination);o.start(at);o.stop(at+duration+.02)}
function noise(duration=.35,volume=.07){if(!soundOn||!audio)return;const len=Math.floor(audio.sampleRate*duration),buffer=audio.createBuffer(1,len,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();data.length;source.buffer=buffer;filter.type='lowpass';filter.frequency.value=700;gain.gain.value=Math.min(.16,volume*1.5);source.connect(filter).connect(gain).connect(audio.destination);source.start()}
function effect(which){if(which==='open'){noise(.26,.045);tone(180,.18,.03,'triangle')}else if(which==='close'){tone(280,.06,.055,'square');tone(165,.12,.05,'triangle',.055)}else if(which==='out'){noise(.65,.10);tone(145,.35,.055,'sine')}else if(which==='light'){tone(660,.12,.035);tone(880,.2,.03,'sine',.08)}else if(which==='rattle'){tone(120,.05,.015,'square');tone(110,.05,.013,'square',.09)}}
const melody=[659,0,784,0,988,784,659,0,587,0,784,0,880,784,587,0,523,0,659,0,784,659,523,0,494,0,587,0,659,587,494,0];function music(){if(!running||!soundOn)return;let f=melody[noteIndex++%melody.length];if(f){tone(f,.34,.016,'sine');tone(f/2,.52,.008,'triangle')}musicTimer=setTimeout(music,290)}
function init(){cancelAnimationFrame(frame);clearTimeout(musicTimer);if(soundOn){audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();noteIndex=0}rooms=names.slice(0,config().count).map(()=>({lit:true,open:false,wind:0,rattle:0}));score=0;timePoints=0;actionPoints=0;penalties=0;remaining=60;spawn=0;acc=0;draw=0;last=0;running=true;updateMode();document.getElementById('end').classList.add('hidden');document.getElementById('start').textContent='처음부터';paint();music();frame=requestAnimationFrame(loop)}
function incident(){let available=rooms.map((r,i)=>!r.open&&r.rattle<=0?i:-1).filter(i=>i>=0);let count=Math.min(available.length,1+rand(remaining<42?config().burst:Math.max(2,config().burst-1)));for(let j=0;j<count;j++){let k=rand(available.length),r=rooms[available.splice(k,1)[0]];if(Math.random()<config().rattle){r.rattle=1.4+Math.random()*1.1;effect('rattle')}else{r.open=true;r.wind=0;effect('open')}}}
function loop(t){if(!running)return;if(!last)last=t;let dt=Math.min((t-last)/1000,.15);last=t;remaining=Math.max(0,remaining-dt);spawn+=dt;draw+=dt;timePoints+=10*rooms.filter(r=>r.lit).length/rooms.length*dt;let interval=config().start-(config().start-config().end)*(60-remaining)/60;while(spawn>=interval){spawn-=interval;incident()}for(let r of rooms){if(r.rattle>0)r.rattle=Math.max(0,r.rattle-dt);if(r.open){r.wind+=dt;if(r.wind>=Math.max(1,config().wind-(60-remaining)*.012)&&r.lit){r.lit=false;penalties+=12;refreshScore();effect('out')}}}if(draw>=.1){draw=0;refreshScore();paint()}if(remaining<=0){running=false;clearTimeout(musicTimer);refreshScore();updateMode();paint();document.getElementById('result').textContent=`${config().label} 모드 · 최종 점수 ${score} / ${1000*config().mult}점 · 촛불 ${rooms.filter(r=>r.lit).length}개가 켜져 있어요.`;document.getElementById('end').classList.remove('hidden');return}frame=requestAnimationFrame(loop)}
board.addEventListener('click',e=>{let w=e.target.closest('[data-window]'),c=e.target.closest('[data-candle]');if(!running)return;if(w){let r=rooms[+w.dataset.window];if(r.open){r.open=false;r.wind=0;actionPoints+=3;refreshScore();effect('close')}else if(r.rattle>0){r.rattle=0;r.open=true;r.wind=0;effect('open')}paint()}if(c){let r=rooms[+c.dataset.candle];if(!r.lit&&!r.open){r.lit=true;actionPoints+=6;refreshScore();effect('light');paint()}}});
function resetBoard(){score=0;timePoints=0;actionPoints=0;penalties=0;remaining=60;spawn=0;acc=0;draw=0;rooms=names.slice(0,config().count).map(()=>({lit:true,open:false,wind:0,rattle:0}));updateMode();paint()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(running)return;mode=b.dataset.mode;resetBoard()});document.getElementById('start').onclick=init;document.getElementById('again').onclick=init;document.getElementById('choose').onclick=()=>{document.getElementById('end').classList.add('hidden');resetBoard();document.querySelector('.difficulty').scrollIntoView({behavior:'smooth',block:'start'})};document.getElementById('sound').onclick=()=>{soundOn=!soundOn;let b=document.getElementById('sound');b.textContent=soundOn?'소리 켜짐 ♫':'소리 꺼짐';b.setAttribute('aria-pressed',String(soundOn));clearTimeout(musicTimer);if(soundOn&&running){audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();music()}};rooms=names.slice(0,config().count).map(()=>({lit:true,open:false,wind:0,rattle:0}));updateMode();paint();
</script></body></html>
