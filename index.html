<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>심야 유령 사냥</title><meta name="description" content="60초 동안 유령을 잡고 공용 순위표에 기록을 남겨 보세요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2314182b'/%3E%3Ctext x='8' y='48' font-size='43'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><b><span>✦</span> 심야 유령 사냥</b><em>60초 도전</em></header><div class="layout"><section><div class="status"><div><small>남은 시간</small><strong id="time">01:00</strong></div><div><small>잡은 점수</small><strong id="score">0점</strong></div></div><div class="field" id="field"><div class="stars">✦　·　✧　·　✦</div><div class="overlay" id="overlay"><div class="moon">☾</div><h1 id="heading">유령이 나타나기 전</h1><p id="message">유령을 눌러 잡아 보세요. 해골을 누르면 감점됩니다!</p><div class="form"><label for="nickname">닉네임</label><input id="nickname" maxlength="16" placeholder="밴드 닉네임"><button id="start">사냥 시작</button></div></div><div class="ground"></div></div><p class="hint">유령 +1점 · 금빛 유령 +3점 · 해골 -1점 · 제한 시간 60초</p><p class="notice" id="notice" role="status"></p></section><aside><div class="board-title"><span>🏆</span><div><h2>유령 사냥 순위</h2><p>닉네임별 최고 기록</p></div></div><ol id="board"><li class="empty">순위를 불러오는 중입니다.</li></ol><button class="refresh" id="refresh">순위 새로고침 ↻</button></aside></div></main><script src="game.js"></script></body></html>
