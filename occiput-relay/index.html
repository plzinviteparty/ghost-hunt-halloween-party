<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151322"><meta name="description" content="대저택의 핼러윈 파티 멤버들이 함께 쓴 릴레이소설로 만든 탐험 게임. 세이브 슬롯과 여섯 가지 엔딩."><title>후두부가 웃는군</title><link rel="stylesheet" href="style.css?v=nurses-21"></head><body><main><header><div><p class="eyebrow">대저택의 핼러윈 파티 · RELAY NOVEL</p><h1>후두부가 웃는군</h1></div><div class="topBtns"><button id="audio" aria-label="소리 전환">♪ ON</button><button id="menu" aria-label="저장과 메뉴">메뉴 ☰</button></div></header><section class="machine"><div class="hud"><span id="place"></span><span id="party"></span></div><div class="viewport"><canvas id="screen" width="1280" height="768" aria-label="방향키 또는 조이스틱으로 움직이고 가까운 대상을 조사하는 게임 화면"></canvas><div id="notice" role="status"></div><div id="mission"></div><div id="chaseHud" hidden><span>뒤돌아보지 말고 오른쪽으로!</span><meter min="0" max="100" id="distance"></meter></div></div><div id="dialog" class="dialog" aria-live="polite"><div id="who">대저택의 릴레이소설</div><p id="words">각자가 이어 쓴 이야기 속에서 출구를 찾아보세요.</p><div id="choices"></div><button id="next">다음 ▸</button></div></section><section class="controller"><div id="joystick" aria-label="이동 조이스틱: 가운데를 누르고 원하는 방향으로 미세요"><span class="stickArrow up" aria-hidden="true">▲</span><span class="stickArrow down" aria-hidden="true">▼</span><span class="stickArrow left" aria-hidden="true">◀</span><span class="stickArrow right" aria-hidden="true">▶</span><span id="joystickThumb" aria-hidden="true"></span></div><p class="instructions">방향키 / WASD 이동 · E / Space 조사<br>조이스틱을 밀어 이동 · 손을 떼면 정지<br>화면을 눌러도 이동할 수 있습니다.<br><span id="hint">가까운 빛나는 대상은 조사할 수 있습니다.</span></p><button id="action">조사 <span>Ⓔ</span></button></section><section class="bag"><div class="bagHead"><span>INVENTORY / 소지품</span><button id="journal">기록 보기</button></div><div id="items"></div></section><footer>원작: 대저택의 핼러윈 파티 참여 멤버들의 릴레이 댓글<br>세이브는 같은 기기·브라우저에 보관됩니다. 사이트 데이터 삭제 시 함
