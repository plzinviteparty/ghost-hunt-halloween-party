<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대저택 유령 경마장</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1021;color:#f7eadd}.wrap{max-width:1100px;margin:auto;padding:18px}h1{margin:0;color:#ffcc6c;font-size:clamp(24px,4vw,36px)}.muted{color:#aaaed0}header,.bar,.panel{background:#1b1b39;border:2px solid #65527a;border-radius:14px;padding:15px;margin-bottom:12px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.money{font-weight:800;color:#ffe089;font-size:22px}.bar{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.track{overflow:hidden;background:linear-gradient(#2c2447 0 16%,#32283a 16% 100%);border:3px solid #877094;border-radius:14px;position:relative;padding-top:26px}.scene{position:absolute;inset:0 0 auto;height:27px;background:repeating-linear-gradient(90deg,#282041 0 35px,#3d3058 35px 39px);text-align:center;color:#f5cb85;font-size:13px}.lane{height:70px;border-bottom:2px dashed #947e88;position:relative;background:repeating-linear-gradient(90deg,transparent 0 95px,#ffffff07 95px 98px)}.lane:nth-child(even){background-color:#ffffff09}.tag{position:absolute;z-index:2;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:105px;padding:8px;background:#1d173bd9;font-weight:bold;font-size:13px}.horse{position:absolute;top:8px;left:105px;font-size:37px;transition:left .14s linear;white-space:nowrap;filter:drop-shadow(2px 3px 1px #08070c)}.horse small{font-size:17px}.finish{position:absolute;right:14px;top:26px;bottom:0;width:15px;background:conic-gradient(#fff 25%,#222 0 50%,#fff 0 75%,#222 0) 0 0/15px 15px}.cols{display:grid;grid-template-columns:1fr 310px;gap:12px}.panel h2{font-size:18px;margin:0 0 14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{min-height:74px}.button,button{cursor:pointer;border:1px solid #9a82b0;border-radius:10px;padding:10px;background:#312b50;color:white;font-size:15px;font-weight:700}button:hover{background:#51416b}button:disabled{cursor:default;opacity:.5}.selected{outline:3px solid #ffcc66;background:#56405b}.betrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.primary{background:#d3782c;color:#180f10;border:0;font-size:18px;padding:14px 20px}.rank{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #514660}.log{min-height:80px;color:#e1c3a4;font-size:14px;line-height:1.6}.result{font-size:20px;font-weight:bold;color:#ffd887;min-height:30px}.foot{color:#9e9dc2;text-align:center;font-size:12px}@media(max-width:730px){.cols{grid-template-columns:1fr}.wrap{padding:8px}.tag{width:77px;font-size:11px}.horse{font-size:29px}.lane{height:61px}.choices{grid-template-columns:repeat(2,1fr)}}
</style><div class="wrap"><header><div><h1>👻 대저택 유령 경마장</h1><span class="muted">호박이 굴러가도 경주는 계속된다!</span></div><div>보유 코인 <span id="coins" class="money"></span></div></header><div class="bar"><span id="round">🏇 1회차</span><span id="phase">베팅 접수 중</span><span id="timer">⏱ 20초 경주</span></div><div class="cols"><main><div class="track"><div class="scene">🌙 🦇 ✨ 대저택의 으스스한 경주로 ✨ 🦇 🌙</div><div id="lanes"></div><div class="finish"></div></div><section class="panel"><h2>🎟 베팅하기</h2><div id="choices" class="choices"></div><p>베팅 금액 (커뮤니티 체험 코인)</p><div class="betrow" id="amounts"></div><button class="primary" id="go">베팅하고 경주 시작!</button><p id="result" class="result"></p><button id="reset">테스트 코인 초기화</button></section></main><aside><section class="panel"><h2>🏆 실시간 순위</h2><div id="rank"></div></section><section class="panel"><h2>📢 중계석</h2><div id="log" class="log">이번 경주의 주인공은 누구일까요?</div></section><section class="panel"><h2>📋 규칙</h2><p class="muted">말을 한 마리 선택하고 코인을 건 뒤 20초간 경주를 관전하세요. 우승 말 적중 시 원금 포함 배당금 지급! 실제 돈이나 경품과 교환되지 않는 테스트 코인만 사용합니다.</p></section></aside></div><p class="foot">1차 체험판 · 혼자 하는 경주 · 코인은 이 브라우저에만 저장됩니다</p></div><script>
const H=[['유령마','👻','🐎',.35,2],['박쥐마','🦇','🐎',.25,3],['호박마','🎃','🐎',.18,4],['해골마','💀','🐎',.12,6],['저주마','🔥','🐎',.07,10],['양초마','🕯️','🐎',.03,20]];
let coins=Number(localStorage.getItem('ghostRaceCoins')??500),round=1,horse=0,amount=20,active=false,progress=H.map(()=>0),winner=0,interval;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('ghostRaceCoins',coins);$('coins').textContent=coins.toLocaleString()+' C'}
function drawControls(){save();$('round').textContent='🏇 '+round+'회차';$('choices').innerHTML=H.map((h,i)=>'<button class="choice '+(horse===i?'selected':'')+'" data-h="'+i+'" '+(active?'disabled':'')+'>'+h[1]+' '+(i+1)+'번 '+h[0]+'<br><small>'+h[4]+'배</small></button>').join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{horse=+b.dataset.h;drawControls()});$('amounts').innerHTML=[5,10,20,50,100].map(x=>'<button data-a="'+x+'" class="'+(x===amount?'selected':'')+'" '+(active?'disabled':'')+'>'+x+' C</button>').join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{amount=+b.dataset.a;drawControls()});$('go').disabled=active||coins<amount;$('go').textContent=active?'경주 중...':'베팅하고 경주 시작!'}
function drawRace(){let w=$('lanes').clientWidth;H.forEach((h,i)=>{let p=document.querySelector('#runner'+i);p.style.left=(Math.max(80,Math.min(w-72,105+(w-205)*progress[i])))+'px'});let ranks=H.map((h,i)=>({h,i,p:progress[i]})).sort((a,b)=>b.p-a.p);$('rank').innerHTML=ranks.map((o,j)=>'<div class="rank"><span>'+(j+1)+'위 '+o.h[1]+' '+o.h[0]+'</span><span>'+Math.round(o.p*100)+'%</span></div>').join('')}
$('lanes').innerHTML=H.map((h,i)=>'<div class="lane"><div class="tag">'+(i+1)+'번 '+h[1]+'<br>'+h[0]+'</div><div class="horse" id="runner'+i+'">'+h[2]+'<small>'+h[1]+'</small></div></div>').join('');
function log(t){$('log').innerHTML=t+'<hr style="border-color:#534461">'+$('log').innerHTML.slice(0,480)}
function chooseWinner(){let r=Math.random();for(let i=0;i<H.length;i++){r-=H[i][3];if(r<=0)return i}return 5}
function start(){if(active||coins<amount)return;active=true;coins-=amount;winner=chooseWinner();progress=H.map(()=>0);$('result').textContent='';let tick=0;drawControls();$('phase').textContent='🏁 경주 진행 중';log('📣 출발! '+(horse+1)+'번 '+H[horse][0]+'에 '+amount+'코인 베팅!');clearInterval(interval);interval=setInterval(()=>{tick++;let left=Math.max(0,20-tick*.1);H.forEach((h,i)=>{let target=i===winner?1:(.72+i*.025);let f=tick/200;let noisy=(Math.random()-.48)*.011;progress[i]=Math.min(1,Math.max(progress[i],Math.min(target,(f*target)+noisy)));});if(tick%30===0){let i=Math.floor(Math.random()*6);log(H[i][1]+' '+H[i][0]+'가 '+['갑자기 가속합니다!','기세를 올립니다!','발굽을 굴립니다!','막판 역전을 노립니다!'][Math.floor(Math.random()*4)])}drawRace();$('timer').textContent='⏱ '+left.toFixed(1)+'초';if(tick>=200){clearInterval(interval);progress[winner]=1;drawRace();active=false;let won=winner===horse;if(won)coins+=amount*H[horse][4];$('phase').textContent='🏆 경주 종료';$('timer').textContent='결승!';$('result').textContent='우승: '+H[winner][1]+' '+H[winner][0]+' · '+(won?'적중! '+(amount*H[horse][4])+'코인 지급':'아쉽게도 '+amount+'코인을 잃었습니다');log('🏆 '+H[winner][0]+' 우승!');round++;$('go').textContent='다음 경주';drawControls();}},100)}
$('go').onclick=start;$('reset').onclick=()=>{if(active)return;coins=500;drawControls();$('result').textContent='체험 코인을 500으로 초기화했습니다.'};drawControls();drawRace();window.addEventListener('resize',drawRace);
</script></html>
