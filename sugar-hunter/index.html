let ac=null,musicTick=0,muted=false;function initAudio(){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}function tone(freq,duration,shape='square',volume=.2,delay=0){if(!ac||muted)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=shape;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02)}function sound(kind){if(!ac||muted)return;if(kind==='candy'){tone(740,.1,'sine',.27);tone(990,.13,'sine',.24,.065)}if(kind==='choc'){tone(523,.12,'triangle',.3);tone(784,.14,'triangle',.3,.08);tone(1175,.2,'sine',.25,.16)}if(kind==='pumpkin'){tone(330,.12,'triangle',.27);tone(440,.16,'triangle',.27,.1);tone(660,.2,'triangle',.26,.2)}if(kind==='double'){tone(470,.09,'sine',.22);tone(750,.14,'sine',.2,.07)}if(kind==='hit'){tone(145,.25,'sawtooth',.33);tone(92,.32,'triangle',.3,.05)}if(kind==='fall'){tone(340,.22,'sawtooth',.28);tone(170,.4,'sawtooth',.28,.17)}if(kind==='pause')tone(310,.1,'triangle',.14)}const melody=[440,0,523,0,415,392,0,330,349,0,415,0,311,294,0,262];setInterval(()=>{if(state!=='playing'||muted||!ac)return;const n=melody[musicTick%melody.length];if(n)tone(n,.19,'triangle',.11);if(musicTick%4===0)tone([110,104,98,87][Math.floor(musicTick/4)%4],.35,'sine',.2);if(musicTick%2===0)tone(1700,.035,'triangle',.032);musicTick++},195);soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'♪ 소리 끔':'♪ 소리 켬';soundBtn.setAttribute('aria-label',muted?'소리 켜기':'소리 끄기');if(!muted)initAudio()};async function loadScores(){try{const response=await fetch('https://halloween-candy-run.hp8bkn2krr.chatgpt.site/api/scores',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();board.replaceChildren();if(!data.scores.length){const li=document.createElement('li');li.textContent='아직 기록이
